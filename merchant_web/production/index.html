<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản Merchant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white max-w-xl w-full p-8 rounded-2xl shadow-xl">
        <div id="error-alert" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
        <div id="success-alert" class="hidden mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm"></div>

        <section id="view-register">
            <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Đăng Ký Tài Khoản Merchant</h2>

            <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên cửa hàng</label>
                    <input type="text" id="storeName" required maxlength="30"
                        placeholder="Nhập tên cửa hàng (tối đa 30 ký tự)"
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                        <input type="text" id="phone" required maxlength="10" oninput="validateNumberOnly(this)"
                            placeholder="0912345678"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" required placeholder="merchant@example.com"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu (8 - 15 ký tự)</label>
                        <div class="relative">
                            <input type="password" id="password" required maxlength="15" placeholder="••••••••"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10" />
                            <button type="button" onclick="togglePassword('password', 'eye-icon-1')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                                <i id="eye-icon-1" class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nhập lại mật khẩu</label>
                        <div class="relative">
                            <input type="password" id="confirmPassword" required maxlength="15" placeholder="••••••••"
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10" />
                            <button type="button" onclick="togglePassword('confirmPassword', 'eye-icon-2')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                                <i id="eye-icon-2" class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mã số thuế</label>
                    <input type="text" id="taxCode" required maxlength="13" oninput="validateNumberOnly(this)"
                        placeholder="Mã số thuế đăng ký cửa hàng"
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Callback URL (Webhook)</label>
                    <input type="url" id="callbackUrl" required maxlength="100"
                        placeholder="https://yourdomain.com/api/payment/callback"
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <button type="submit" id="register-btn"
                    class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200 mt-4 disabled:opacity-60">
                    Đăng Ký Merchant
                </button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-4">
                Đã có tài khoản?
                <a href="login.html" class="text-blue-600 hover:underline font-medium">Đăng nhập</a>
            </p>
        </section>
    </div>

    <script>
        const API_BASE = APP_CONFIG.production.API_ROOT + '/auth';

        function validateNumberOnly(input) {
            input.value = input.value.replace(/\D/g, '');
        }

        function togglePassword(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            const isHidden = field.type === 'password';
            field.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('fa-eye', isHidden);
            icon.classList.toggle('fa-eye-slash', !isHidden);
        }

        let alertTimeout = null;

        function showError(msg) {
            clearAlerts();
            const el = document.getElementById('error-alert');
            el.textContent = msg;
            el.classList.remove('hidden');
            alertTimeout = setTimeout(() => { el.classList.add('hidden'); }, 5000);
        }

        function clearAlerts() {
            if (alertTimeout) {
                clearTimeout(alertTimeout);
                alertTimeout = null;
            }
            document.getElementById('error-alert').classList.add('hidden');
            document.getElementById('success-alert').classList.add('hidden');
        }

        // Hiệu ứng loading cho nút: hiện spinner + chữ, khoá nút trong lúc gọi API
        function setLoading(btnId, loading, text = 'Đang xử lý...') {
            const btn = document.getElementById(btnId);
            if (loading) {
                if (btn.dataset.loading) return;
                btn.dataset.loading = '1';
                btn.dataset.html = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>' + text;
                btn.disabled = true;
            } else {
                if (!btn.dataset.loading) return;
                delete btn.dataset.loading;
                btn.innerHTML = btn.dataset.html;
                btn.disabled = false;
            }
        }

        async function api(path, { body } = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'ngrok-skip-browser-warning': 'true',
            };
            let res;
            try {
                res = await fetch(API_BASE + path, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(body || {}),
                });
            } catch (_) {
                throw new Error('Không kết nối được tới server');
            }

            const json = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(json.message || `Có lỗi xảy ra (HTTP ${res.status})`);
            return json.data ?? {};
        }

        async function handleRegister(event) {
            event.preventDefault();
            clearAlerts();

            const storeName = document.getElementById('storeName').value.trim();
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const taxCode = document.getElementById('taxCode').value;
            const callbackUrl = document.getElementById('callbackUrl').value.trim();

            if (password.length < 8 || password.length > 15) return showError('Mật khẩu phải có độ dài từ 8 đến 15 ký tự!');
            if (password !== confirmPassword) return showError('Mật khẩu nhập lại không khớp!');
            if (!storeName || storeName.length > 30) return showError('Tên cửa hàng không được để trống và tối đa 30 ký tự!');
            if (phone.length < 10 || phone.length > 11) return showError('Số điện thoại phải có độ dài từ 10 đến 11 chữ số!');
            if (!/^\d{10}(\d{3})?$/.test(taxCode)) return showError('Mã số thuế phải là số và có độ dài chính xác 10 hoặc 13 chữ số.');
            if (callbackUrl.length > 100) return showError('Callback URL không được vượt quá 100 ký tự!');
            try { new URL(callbackUrl); } catch (_) { return showError('Callback URL không hợp lệ!'); }

            setLoading('register-btn', true, 'Đang gửi mã OTP...');
            try {
                const data = await api('/register', { body: { phone, email } });
                
                // Lưu dữ liệu form và token tạm vào sessionStorage
                sessionStorage.setItem('reg_data', JSON.stringify({ storeName, phone, email, password, taxCode, callbackUrl }));
                sessionStorage.setItem('otp_token', data.otp_token);

                // Chuyển sang trang OTP riêng biệt
                window.location.href = 'register-otp.html';
            } catch (e) {
                showError(e.message);
                setLoading('register-btn', false);
            }
        }
    </script>
</body>
</html>
