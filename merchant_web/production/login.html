<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Merchant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white max-w-md w-full p-8 rounded-2xl shadow-xl">
        <div id="error-alert" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
        <div id="success-alert" class="hidden mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm"></div>

        <!-- Bước 1: số điện thoại + mật khẩu -->
        <section id="view-login">
            <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Đăng Nhập Merchant</h2>
            <form class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                    <input type="text" id="phone" required maxlength="10" oninput="validateNumberOnly(this)"
                        placeholder="0912345678"
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                    <div class="relative">
                        <input type="password" id="password" required maxlength="15" placeholder="••••••••"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10" />
                        <button type="button" onclick="togglePassword('password', 'eye-icon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                            <i id="eye-icon" class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="login-btn"
                    class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200 disabled:opacity-60">
                    Đăng Nhập
                </button>
            </form>

            <!-- NÚT CHUYỂN SANG MÔI TRƯỜNG SANDBOX ĐẶT NGAY DƯỚI NÚT ĐĂNG NHẬP -->
            <div class="mt-4 pt-4 border-t border-gray-100">
                <a href="../sandbox/sandbox-login.html" 
                    class="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-semibold py-2.5 rounded-lg hover:bg-emerald-100 transition duration-200 flex items-center justify-center gap-2 text-sm block text-center">
                    <i class="fa-solid fa-flask"></i> Chuyển sang Môi trường Sandbox (Test)
                </a>
            </div>

            <p class="text-center text-sm text-gray-600 mt-4">
                Chưa có tài khoản?
                <a href="index.html" class="text-blue-600 hover:underline font-medium">Đăng ký</a>
            </p>
        </section>

        <!-- Bước 2: nhập OTP -->
        <section id="view-otp" class="hidden">
            <h2 id="otp-title" class="text-2xl font-bold text-gray-800 text-center mb-2">Xác thực OTP</h2>
            <p id="otp-desc-email" class="text-center text-sm text-gray-600 mb-6">
                Mã OTP đã được gửi tới <span id="otp-email" class="font-semibold"></span>
            </p>
            <p id="otp-desc-totp" class="hidden text-center text-sm text-gray-600 mb-6">
                <i class="fa-solid fa-shield-halved text-blue-600 mr-1"></i>
                Mở ứng dụng <span class="font-semibold">Google Authenticator</span> và nhập mã 6 số của tài khoản Merchant
            </p>
            <form class="space-y-4" onsubmit="handleVerifyLogin(event)">
                <input type="text" id="otp" required maxlength="6" inputmode="numeric"
                    oninput="validateNumberOnly(this)" autocomplete="one-time-code" placeholder="Nhập mã OTP"
                    class="w-full px-4 py-3 border rounded-lg text-center text-xl tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <button type="submit" id="otp-btn"
                    class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200 disabled:opacity-60">
                    Xác nhận
                </button>
            </form>
            <div class="flex justify-between text-sm mt-4">
                <button type="button" onclick="backToLogin()" class="text-gray-600 hover:underline">← Quay lại</button>
                <button type="button" id="resend-btn" onclick="resendOtp()"
                    class="text-blue-600 hover:underline disabled:text-gray-400 disabled:no-underline">Gửi lại mã</button>
            </div>
        </section>
    </div>

    <script>
        // ====== CONFIG ======
        const API_BASE = APP_CONFIG.production.API_ROOT + '/auth';
        const RESEND_SECONDS = 60;

        // ====== STATE ======
        let otpToken = null;
        let otpMethod = 'email'; // 'email' | 'totp'

        // ====== HELPERS ======
        function validateNumberOnly(input) {
            input.value = input.value.replace(/\D/g, '');
        }

        function togglePassword(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            const isHidden = field.type === 'password';
            field.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('fa-eye', isHidden);
            icon.classList.toggle('fa-eye-slash', !isHidden);
        }

        let alertTimeout = null;

        function showError(msg) {
            clearAlerts();
            const el = document.getElementById('error-alert');
            el.textContent = msg;
            el.classList.remove('hidden');
            alertTimeout = setTimeout(() => { el.classList.add('hidden'); }, 5000);
        }

        function showSuccess(msg) {
            clearAlerts();
            const el = document.getElementById('success-alert');
            el.textContent = msg;
            el.classList.remove('hidden');
            alertTimeout = setTimeout(() => { el.classList.add('hidden'); }, 5000);
        }

        function clearAlerts() {
            if (alertTimeout) {
                clearTimeout(alertTimeout);
                alertTimeout = null;
            }
            document.getElementById('error-alert').classList.add('hidden');
            document.getElementById('success-alert').classList.add('hidden');
        }

        // Hiệu ứng loading cho nút: hiện spinner + chữ, khoá nút trong lúc gọi API
        function setLoading(btnId, loading, text = 'Đang xử lý...') {
            const btn = document.getElementById(btnId);
            if (loading) {
                if (btn.dataset.loading) return;
                btn.dataset.loading = '1';
                btn.dataset.html = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>' + text;
                btn.disabled = true;
            } else {
                if (!btn.dataset.loading) return;
                delete btn.dataset.loading;
                btn.innerHTML = btn.dataset.html;
                btn.disabled = false;
            }
        }

        async function api(path, { body, token, otpTokenHeader } = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'ngrok-skip-browser-warning': 'true',
            };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            if (otpTokenHeader) headers['X-Otp-Token'] = otpTokenHeader;

            let res;
            try {
                res = await fetch(API_BASE + path, {
                    method: 'POST',
                    credentials: 'include',
                    headers,
                    body: JSON.stringify(body || {}),
                });
            } catch (_) {
                throw new Error('Không kết nối được tới server');
            }

            const json = await res.json().catch(() => ({}));
            if (!res.ok) {
                const err = new Error(json.message || `Có lỗi xảy ra (HTTP ${res.status})`);
                err.remainingAttempts = json.remainingAttempts;
                throw err;
            }
            return json.data ?? {};
        }

        function startResendTimer() {
            const btn = document.getElementById('resend-btn');
            let left = RESEND_SECONDS;
            btn.disabled = true;
            btn.textContent = `Gửi lại mã (${left}s)`;
            const timer = setInterval(() => {
                left--;
                if (left <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = 'Gửi lại mã';
                } else {
                    btn.textContent = `Gửi lại mã (${left}s)`;
                }
            }, 1000);
        }

        // Đổi chữ/ô nhập/nút "Gửi lại mã" theo phương thức xác thực của tài khoản
        function applyOtpMethod(method, maskedEmail) {
            const isTotp = method === 'totp';
            otpMethod = isTotp ? 'totp' : 'email';

            document.getElementById('otp-title').textContent = isTotp ? 'Xác thực Google Authenticator' : 'Xác thực OTP';
            document.getElementById('otp-desc-email').classList.toggle('hidden', isTotp);
            document.getElementById('otp-desc-totp').classList.toggle('hidden', !isTotp);
            document.getElementById('resend-btn').classList.toggle('hidden', isTotp);
            document.getElementById('otp').placeholder = isTotp ? 'Mã 6 số từ ứng dụng' : 'Nhập mã OTP';
            if (!isTotp) document.getElementById('otp-email').textContent = maskedEmail || '';
        }

        function showView(view) {
            ['login', 'otp'].forEach(v =>
                document.getElementById('view-' + v).classList.toggle('hidden', v !== view));
        }

        function backToLogin() {
            clearAlerts();
            otpToken = null;
            showView('login');
        }

        // ====== LUỒNG ĐĂNG NHẬP ======
        async function handleLogin(event) {
            event.preventDefault();
            clearAlerts();

            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            if (phone.length < 10 || phone.length > 11) return showError('Số điện thoại phải có độ dài từ 10 đến 11 chữ số!');
            if (password.length < 8 || password.length > 15) return showError('Mật khẩu phải có độ dài từ 8 đến 15 ký tự!');

            setLoading('login-btn', true, 'Đang đăng nhập...');
            try {
                const data = await api('/login', { body: { phone, password } });
                otpToken = data.otp_token;

                document.getElementById('otp').value = '';
                applyOtpMethod(data.otp_method, data.masked_email);
                showView('otp');
                if (otpMethod === 'email') startResendTimer();
                document.getElementById('otp').focus();
            } catch (e) {
                let msg = e.message;
                if (typeof e.remainingAttempts === 'number') msg += ` (còn ${e.remainingAttempts} lần thử)`;
                showError(msg);
            } finally {
                setLoading('login-btn', false);
            }
        }

        async function resendOtp() {
            if (otpMethod === 'totp') return;
            clearAlerts();
            const resendBtn = document.getElementById('resend-btn');
            resendBtn.disabled = true;
            resendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Đang gửi...';
            try {
                const data = await api('/resend-login-otp', { otpTokenHeader: otpToken });
                document.getElementById('otp-email').textContent = data.masked_email;
                showSuccess('Đã gửi lại mã OTP');
                startResendTimer();
            } catch (e) {
                showError(e.message);
                resendBtn.disabled = false;
                resendBtn.textContent = 'Gửi lại mã';
            }
        }

        async function handleVerifyLogin(event) {
            event.preventDefault();
            clearAlerts();

            const otp = document.getElementById('otp').value;
            if (!otp) return showError('Vui lòng nhập mã OTP');

            setLoading('otp-btn', true, 'Đang xác thực...');
            try {
                const data = await api('/verify-login-otp', { body: { otp }, otpTokenHeader: otpToken });
                // refresh_token do server đặt vào cookie httpOnly; dashboard tự lấy access_token từ cookie đó
                localStorage.setItem('user_phone', data.user_info.phone);
                otpToken = null;
                window.location.href = 'dashboard.html';
            } catch (e) {
                showError(e.message);
                setLoading('otp-btn', false);
                const otpInput = document.getElementById('otp');
                otpInput.value = '';
                otpInput.focus();
            }
        }

        // ====== KHỞI TẠO ======
        window.addEventListener('load', () => {
            // Dọn token của phiên bản cũ (trước đây lưu trong localStorage)
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');

            // user_phone chỉ là dấu hiệu "đã đăng nhập"; phiên thật nằm ở cookie httpOnly
            if (localStorage.getItem('user_phone')) {
                window.location.href = 'dashboard.html';
                return;
            }

            const registeredPhone = sessionStorage.getItem('registered_phone');
            if (registeredPhone) {
                document.getElementById('phone').value = registeredPhone;
                sessionStorage.removeItem('registered_phone');
                showSuccess('Đăng ký tài khoản Merchant thành công! Vui lòng đăng nhập.');
            }
        });
    </script>
</body>
</html>
