<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực OTP Đăng Ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white max-w-md w-full p-8 rounded-2xl shadow-xl">
        <div id="error-alert" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
        <div id="success-alert" class="hidden mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm"></div>

        <h2 class="text-2xl font-bold text-gray-800 text-center mb-2">Xác thực OTP</h2>
        <p class="text-center text-sm text-gray-600 mb-6">
            Mã OTP đã được gửi tới <span id="otp-email" class="font-semibold"></span>
        </p>

        <form class="space-y-4" onsubmit="handleVerifyRegister(event)">
            <input type="text" id="otp" required maxlength="6" inputmode="numeric"
                oninput="validateNumberOnly(this)" placeholder="Nhập mã OTP"
                class="w-full px-4 py-3 border rounded-lg text-center text-xl tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="submit" id="otp-btn"
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200 disabled:opacity-60">
                Xác nhận
            </button>
        </form>

        <div class="flex justify-between text-sm mt-4">
            <button type="button" onclick="backToForm()" class="text-gray-600 hover:underline">← Quay lại</button>
            <button type="button" id="resend-btn" onclick="resendOtp()"
                class="text-blue-600 hover:underline disabled:text-gray-400 disabled:no-underline">Gửi lại mã</button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://orectic-noctilucent-ronan.ngrok-free.dev/api/v2/merchant/auth';
        const RESEND_SECONDS = 60;
        let timer = null;

        function validateNumberOnly(input) {
            input.value = input.value.replace(/\D/g, '');
        }

        function showError(msg) {
            document.getElementById('success-alert').classList.add('hidden');
            const el = document.getElementById('error-alert');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function showSuccess(msg) {
            document.getElementById('error-alert').classList.add('hidden');
            const el = document.getElementById('success-alert');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function clearAlerts() {
            document.getElementById('error-alert').classList.add('hidden');
            document.getElementById('success-alert').classList.add('hidden');
        }

    

        // Hiệu ứng loading cho nút: hiện spinner + chữ, khoá nút trong lúc gọi API
        function setLoading(btnId, loading, text = 'Đang xử lý...') {
            const btn = document.getElementById(btnId);
            if (loading) {
                if (btn.dataset.loading) return;
                btn.dataset.loading = '1';
                btn.dataset.html = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>' + text;
                btn.disabled = true;
            } else {
                if (!btn.dataset.loading) return;
                delete btn.dataset.loading;
                btn.innerHTML = btn.dataset.html;
                btn.disabled = false;
            }
        }

        async function api(path, { body, token } = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'ngrok-skip-browser-warning': 'true',
            };
            if (token) headers['Authorization'] = 'Bearer ' + token;

            let res;
            try {
                res = await fetch(API_BASE + path, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(body || {}),
                });
            } catch (_) {
                throw new Error('Không kết nối được tới server');
            }

            const json = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(json.message || `Có lỗi xảy ra (HTTP ${res.status})`);
            return json.data ?? {};
        }

        function startResendTimer() {
            if (timer) clearInterval(timer);
            const btn = document.getElementById('resend-btn');
            let left = RESEND_SECONDS;
            btn.disabled = true;
            btn.textContent = `Gửi lại mã (${left}s)`;
            
            timer = setInterval(() => {
                left--;
                if (left <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = 'Gửi lại mã';
                } else {
                    btn.textContent = `Gửi lại mã (${left}s)`;
                }
            }, 1000);
        }

        function backToForm() {
            if (timer) clearInterval(timer);
            window.location.href = 'index.html';
        }

        async function resendOtp() {
            clearAlerts();
            const regData = JSON.parse(sessionStorage.getItem('reg_data') || '{}');
            const resendBtn = document.getElementById('resend-btn');
            if (timer) clearInterval(timer);
            resendBtn.disabled = true;
            resendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Đang gửi...';
            try {
                const data = await api('/register', { body: { phone: regData.phone, email: regData.email } });
                sessionStorage.setItem('otp_token', data.otp_token);
                showSuccess('Đã gửi lại mã OTP');
                startResendTimer();
            } catch (e) {
                showError(e.message);
                resendBtn.disabled = false;
                resendBtn.textContent = 'Gửi lại mã';
            }
        }

        async function handleVerifyRegister(event) {
            event.preventDefault();
            clearAlerts();

            const otp = document.getElementById('otp').value;
            const otpToken = sessionStorage.getItem('otp_token');
            const regData = JSON.parse(sessionStorage.getItem('reg_data') || '{}');

            if (!otp) return showError('Vui lòng nhập mã OTP');

            setLoading('otp-btn', true, 'Đang xác thực...');
            try {
                await api('/verify-register', {
           
                    body: {
                        otp_token: otpToken,
                        otp,
                        password: regData.password,
                        store_name: regData.storeName,
                        tax_code: regData.taxCode,
                        call_back_url: regData.callbackUrl,
                    },
                });

                sessionStorage.setItem('registered_phone', regData.phone);
                sessionStorage.removeItem('otp_token');
                sessionStorage.removeItem('reg_data');
                window.location.href = 'login.html';
            } catch (e) {
                showError(e.message);
                setLoading('otp-btn', false);
            }
        }

        window.addEventListener('load', () => {
            const regData = JSON.parse(sessionStorage.getItem('reg_data') || '{}');
            if (!regData.email) {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('otp-email').textContent = regData.email;
            startResendTimer();
        });
    </script>
</body>
</html>
